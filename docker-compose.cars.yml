services:
  car_1:
    build:
      context: .
    command: python -u car.py car_1 fast
    environment:
    - MQTT_BROKER=mosquitto
    - VEHICLE_ID=car1
    - DISCHARGE_RATE=fast
    - CONTRACT_ADDRESS=
    - VEHICLE_PRIVATE_KEY=00ce989829ee5234d33ad2f75ffb3a854f1cba127832d4bb6cb683028963ebad
    networks:
    - carros_net
    depends_on:
      geth:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      contract_deploy:
        condition: service_completed_successfully
    volumes:
    - ./blockchain:/app/blockchain
