version: '3.8'
services:
  car_1:
    build:
      context: .
    command: python -u car.py car_1 slow
    environment:
    - MQTT_BROKER=172.16.201.10
    - VEHICLE_ID=car1
    - DISCHARGE_RATE=slow
    networks:
    - carros_net
  car_2:
    build:
      context: .
    command: python -u car.py car_2 slow
    environment:
    - MQTT_BROKER=172.16.201.10
    - VEHICLE_ID=car2
    - DISCHARGE_RATE=slow
    networks:
    - carros_net
  car_3:
    build:
      context: .
    command: python -u car.py car_3 normal
    environment:
    - MQTT_BROKER=172.16.201.10
    - VEHICLE_ID=car3
    - DISCHARGE_RATE=normal
    networks:
    - carros_net
  car_4:
    build:
      context: .
    command: python -u car.py car_4 slow
    environment:
    - MQTT_BROKER=172.16.201.10
    - VEHICLE_ID=car4
    - DISCHARGE_RATE=slow
    networks:
    - carros_net
  car_5:
    build:
      context: .
    command: python -u car.py car_5 normal
    environment:
    - MQTT_BROKER=172.16.201.10
    - VEHICLE_ID=car5
    - DISCHARGE_RATE=normal
    networks:
    - carros_net
networks:
  carros_net:
    driver: bridge
