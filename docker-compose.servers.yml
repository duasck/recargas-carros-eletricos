version: '3.8'
services:
  server_a:
    build:
      context: .
    command: python servers/server_a.py
    container_name: server_a
    ports:
    - 5000:5000
    networks:
    - carros_net
    environment:
    - CONTRACT_ADDRESS=None
    - PRIVATE_KEY=8ee48f3ac827c9081a44ac0b1dedf9cbf2f3c97cd05106652dd78f5166f8600a
  server_b:
    build:
      context: .
    command: python servers/server_b.py
    container_name: server_b
    ports:
    - 5001:5001
    networks:
    - carros_net
    environment:
    - CONTRACT_ADDRESS=None
    - PRIVATE_KEY=00443c2aaed0dce9a148831dc4862d925d031d95c1a67422facda3fd75014e84
  server_c:
    build:
      context: .
    command: python servers/server_c.py
    container_name: server_c
    ports:
    - 5002:5002
    networks:
    - carros_net
    environment:
    - CONTRACT_ADDRESS=None
    - PRIVATE_KEY=d96bd0128650f51e3771875c316f3a9746b97eceeb4837beb8fb071988ec7d91
  server_d:
    build:
      context: .
    command: python servers/server_d.py
    container_name: server_d
    ports:
    - 5003:5003
    networks:
    - carros_net
    environment:
    - CONTRACT_ADDRESS=None
    - PRIVATE_KEY=8e891f39c68403bb12855b0566e9bde5f096d9c82e17766903f2d74007a01f13
  server_e:
    build:
      context: .
    command: python servers/server_e.py
    container_name: server_e
    ports:
    - 5004:5004
    networks:
    - carros_net
    environment:
    - CONTRACT_ADDRESS=None
    - PRIVATE_KEY=730e26b3fca5c4f6e2f7d6349f2ec952d613abc4902b54dd89a29355351ed319
  geth:
    image: ethereum/client-go
    container_name: geth
    ports:
    - 8545:8545
    - 30303:30303
    command: --dev --http --http.addr 0.0.0.0 --http.api eth,net,web3,personal --http.corsdomain=*
      --http.vhosts=*
    networks:
    - carros_net
  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    ports:
    - 18833:18833
    - 9001:9001
    volumes:
    - ./mosquitto/config:/mosquitto/config
    - ./mosquitto/data:/mosquitto/data
    - ./mosquitto/log:/mosquitto/log
    networks:
    - carros_net
  contract_deploy:
    build:
      context: .
    command: python blockchain/deploy_contract.py
    container_name: contract_deploy
    networks:
    - carros_net
    depends_on:
    - geth
  transactions_api:
    build:
      context: .
    command: python api/transactions.py
    container_name: transactions_api
    ports:
    - 5100:5100
    networks:
    - carros_net
    environment:
    - CONTRACT_ADDRESS=None
    depends_on:
    - geth
networks:
  carros_net:
    driver: bridge
